[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "msclap-infer"
dynamic = ["version"]
description = "Standalone inference-only Microsoft CLAP 2023 audio and text embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Benjamin Elizalde"}, {name = "Microsoft CLAP contributors"}]
maintainers = [{name = "openmirlab"}]
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=2.0",
  "tomli>=2; python_version < '3.11'",
  "torch>=2.7",
  # Temporary 5.x cap; remove only after GPT-2 tokenizer/encoder parity.
  # Tracked in docs/compatibility.md; review before the first public release.
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
wav = ["soundfile>=0.13"]
dev = ["build>=1.3", "pytest>=8", "ruff>=0.8", "soundfile>=0.13"]

[project.scripts]
msclap-infer = "msclap_infer.cli:main"

[tool.hatch.version]
path = "src/msclap_infer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/msclap_infer"]

[tool.hatch.build.targets.wheel.force-include]
"src/msclap_infer/config/checkpoints.toml" = "msclap_infer/config/checkpoints.toml"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "docs/", "README.md", "CLAUDE.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml", ".gitignore", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads the real author checkpoint"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/msclap_infer/_impl/htsat.py", "src/msclap_infer/_impl/clap.py"]
